[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobatlas"
dynamic = ["version"]
description = "Finds jobs on employers' own hiring systems and scores them against a profile."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nathan Fabrikant" }]
dependencies = []

[project.urls]
Repository = "https://github.com/nathaniasSC2/JobAtlas"

[project.scripts]
jobatlas = "jobatlas.cli:main"

[tool.setuptools]
# examples/ ships inside the package so an installed jobatlas can still find them
packages = ["jobatlas", "jobatlas.adapters", "jobatlas.examples"]
package-dir = { "jobatlas.examples" = "examples" }

[tool.setuptools.package-data]
jobatlas = ["data/*.json"]
"jobatlas.examples" = ["*.json", "*.example"]

[tool.setuptools.dynamic]
version = { attr = "jobatlas.__version__" }
